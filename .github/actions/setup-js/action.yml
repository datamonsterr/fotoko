name: Set up JavaScript workspace
description: pnpm (version from packageManager) and Node from .nvmrc with the pnpm store cache, then a frozen install.
runs:
  using: composite
  steps:
    - name: Start job timer
      shell: bash
      run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      env:
        LEFTHOOK: '0'
      run: pnpm install --frozen-lockfile
