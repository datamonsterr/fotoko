[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Errors and logging
thiserror = "2.0.21"
anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
# Time and ids
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
# Workspace crates
fotoko-protocol = { path = "crates/protocol" }
fotoko-core = { path = "crates/core" }
fotoko-api = { path = "crates/api" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"

# line-tables-only keeps backtraces; dependencies build without debug info.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
