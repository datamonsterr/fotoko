[package]
name = "fotoko-pi-agent"
description = "Raspberry Pi agent: receives print jobs over MQTT, prints through CUPS, reports status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fotoko-pi-agent"
path = "src/main.rs"

[dependencies]
fotoko-protocol.workspace = true
fotoko-printer-sim.workspace = true
async-trait = "0.1.89"
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util = "0.7.20"
toml = "1.2.0"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rumqttd = "0.20.0"
tempfile = "3.27.0"

[lints]
workspace = true
