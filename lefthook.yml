pre-commit:
  skip: [merge, rebase]
  parallel: true
  commands:
    prettier:
      glob: '*.{js,jsx,cjs,mjs,ts,tsx,json,md,mdx,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
    rustfmt:
      glob: '*.rs'
      run: cargo fmt --all --check
commit-msg:
  skip: [merge, rebase]
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "{1}"
pre-push:
  skip: [merge, rebase]
  commands:
    fast:
      run: bash scripts/ci/fast.sh
