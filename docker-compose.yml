# The whole Fotoko stack on one machine, simulated: no AWS, no payOS, no printer.
#
#   docker compose up --build
#   open http://localhost:8081/p/stand-001      (customer app, pay on the mock at :8082)
#   docker compose exec pi-agent ls /var/lib/fotoko/sim-out      (the printed pages)
#
# See "Run the whole stack locally" in README.md. The CI-only test deps are in
# docker-compose.test.yml.
name: fotoko

x-tcp-check: &tcp-check
  interval: 2s
  timeout: 3s
  retries: 30

x-payos: &payos
  PAYOS_CLIENT_ID: local-client-id
  PAYOS_API_KEY: local-api-key
  PAYOS_CHECKSUM_KEY: local-checksum-key

services:
  # MQTT broker (embedded rumqttd), plain TCP, no auth.
  broker:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: broker
    healthcheck:
      <<: *tcp-check
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/1883']

  # fotoko-local: the HTTP API on in-memory repos and local-fs photo storage.
  api:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: api
    environment:
      <<: *payos
      FOTOKO_LOCAL_PRINTERS: stand-001
      FOTOKO_LOCAL_SECRET: local-url-secret
      FOTOKO_MQTT_URL: mqtt://broker:1883
      PAYOS_BASE_URL: http://payos-mock:8082
      # What the browser and the Pi use to reach the app: photo URLs and payOS return URLs.
      FOTOKO_LOCAL_PUBLIC_URL: http://localhost:8081
      PUBLIC_APP_URL: http://localhost:8081
    healthcheck:
      <<: *tcp-check
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8787']
    depends_on:
      broker:
        condition: service_healthy
      payos-mock:
        condition: service_healthy

  # Hosted checkout page with a "Pay" button; sends the signed webhook to the API.
  payos-mock:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: payos-mock
    environment:
      <<: *payos
      FOTOKO_API_URL: http://api:8787
      # The browser follows checkoutUrl, so it points at the published port.
      PAYOS_MOCK_PUBLIC_URL: http://localhost:8082
    ports:
      - '127.0.0.1:8082:8082'
    healthcheck:
      <<: *tcp-check
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8082']

  # Expo web app (local mode) plus a proxy to the API, so the browser sees one origin.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:8081
    environment:
      API_URL: http://api:8787
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      <<: *tcp-check
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
    depends_on:
      api:
        condition: service_healthy

  # Pi agent on the printer simulation. It shares the web container's network namespace so that
  # the photo URLs the API hands out (http://localhost:8081/...) work for the agent as well.
  pi-agent:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: pi-agent
    network_mode: 'service:web'
    volumes:
      - ./docker/pi-agent.toml:/etc/fotoko/agent.toml:ro
      - sim-out:/var/lib/fotoko/sim-out
    depends_on:
      broker:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  sim-out:
