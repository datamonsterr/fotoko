# cargo deny check (advisories, licenses, bans, sources)
[advisories]
version = 2
# rumqttc 0.25.1 and rumqttd 0.20.0 (both latest on crates.io, checked 2026-11-05) pin
# rustls-webpki 0.102.x and rustls-pemfile. Remove these entries once rumqttc moves to
# rustls-webpki >= 0.103.16 / rustls-pki-types PEM parsing. Review by 2027-02-05; tracked in docs/ci.md.
ignore = [
    { id = "RUSTSEC-2026-0049", reason = "rumqttc pins rustls-webpki 0.102; MQTT server is AWS IoT / local broker, no CRLs used" },
    { id = "RUSTSEC-2026-0098", reason = "rumqttc pins rustls-webpki 0.102; no URI name constraints in our trust anchors" },
    { id = "RUSTSEC-2026-0099", reason = "rumqttc pins rustls-webpki 0.102; no wildcard name constraints in our trust anchors" },
    { id = "RUSTSEC-2026-0104", reason = "rumqttc pins rustls-webpki 0.102; CRL parsing is not enabled" },
    { id = "RUSTSEC-2026-0382", reason = "rumqttc pins rustls-webpki 0.102; trust anchors are the AWS IoT root CA only" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; pulled in by rumqttc, only parses our own PEM files" },
]

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
