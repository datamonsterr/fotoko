# Pi agent of the local stack (docker-compose.yml): simulated printer, plain MQTT to the broker.
printer_id = "stand-001"

[mqtt]
host = "broker"
port = 1883
tls = false

[printer]
backend = "sim"

[sim]
# Pages land here as {jobId}-{index}-{photoId}-{n}.png (the `sim-out` volume).
out_dir = "/var/lib/fotoko/sim-out"
paper = 500

[storage]
state_dir = "/var/lib/fotoko/state"
# Photo URLs are http://localhost:8081/... : allowed in the simulation only.
allow_insecure_http = true
